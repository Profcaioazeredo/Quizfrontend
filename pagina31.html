<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz de Frontend - Pergunta 31</title>
<link href="style.css" rel="stylesheet">
</head>
<body>
<div class="container-kahoot">
  <div class="card-kahoot">
    <div class="top-bar">
      <span class="badge-pergunta">Pergunta 31</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" style="width:90%"></div>
    </div>
    <h1 class="pergunta-titulo">Em uma requisição feita com fetch, qual método é usado para transformar o corpo da resposta em um objeto JavaScript?</h1>
    <div class="answers-grid">
      <button class="answer-btn btn-vermelho" onclick="window.location.href='explicacao31.html'">
        <span class="answer-shape">▲</span> resposta.text()
      </button>
      <button class="answer-btn btn-azul" onclick="window.location.href='explicacao31.html'">
        <span class="answer-shape">◆</span> resposta.parse()
      </button>
      <button class="answer-btn btn-amarelo" onclick="window.location.href='pagina32.html'">
        <span class="answer-shape">●</span> resposta.json()
      </button>
      <button class="answer-btn btn-verde" onclick="window.location.href='explicacao31.html'">
        <span class="answer-shape">■</span> resposta.toObject()
      </button>
    </div>
  </div>
</div>
