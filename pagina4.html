<div class="answers-grid">
<button class="answer-btn btn-vermelho" onclick="responder('errada')"><span class="answer-shape">▲</span>Uma função que executa apenas uma vez durante todo o ciclo de vida da aplicação</button>
<button class="answer-btn btn-azul" onclick="responder('errada')"><span class="answer-shape">◆</span>Uma tag HTML usada para carregamento assíncrono de imagens</button>
<button class="answer-btn btn-amarelo" onclick="responder('errada')"><span class="answer-shape">●</span>Um seletor CSS para elementos que ainda não foram carregados</button>
<button class="answer-btn btn-verde" onclick="responder('certa')"><span class="answer-shape">■</span>Um objeto que representa a conclusão ou falha futura de uma operação assíncrona</button>

<script>
function responder(tipo){
if(tipo === 'certa'){
window.location.href = 'pagina5.html';

var atual = parseInt(localStorage.getItem('erros') || '0');
localStorage.setItem('erros', atual + 1);
